# SonarQube Configuration for Spiderfoot
# Project identification
sonar.projectKey=number-two-scope
sonar.projectName=Spiderfoot OSINT Platform
sonar.projectVersion=4.0d

# SonarQube server connection
sonar.host.url=https://sonar.blk.ing
sonar.token=sqp_ec4383f070222479130cc3a53c55257fd4fb7bb4

# Source code paths
sonar.sources=spiderfoot,modules,sf.py,sfcli.py,sfwebui.py,sfapi.py,spiderfoot_db.py,correlations
sonar.tests=test

# Encoding
sonar.sourceEncoding=UTF-8

# Language settings
sonar.language=py,js

# Python-specific settings
sonar.python.version=3.9,3.10,3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# JavaScript/TypeScript settings (for templates and static files)
sonar.javascript.file.suffixes=.js,.jsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/test/**,**/docs/**,**/__pycache__/**,**/venv/**,**/.venv/**,**/node_modules/**,**/.pytest_cache/**,**/*.pyc,**/static/js/lib/**

# Test exclusions
sonar.test.exclusions=**/test/**
sonar.coverage.exclusions=**/test/**,**/conftest.py,**/setup.py

# Duplication exclusions (test files often have similar structure)
sonar.cpd.exclusions=**/test/**

# Code coverage settings
sonar.coverage.exclusions=**/test/**,**/__init__.py

# Quality gate settings
sonar.qualitygate.wait=false

# Issues and rules
# Enable security hotspot detection
sonar.security.hotspots.enabled=true

# Python-specific rules
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.bandit.reportPaths=bandit-report.json

# JavaScript linting
sonar.javascript.eslint.reportPaths=eslint-report.json

# Complexity thresholds
sonar.complexity.file=80
sonar.complexity.function=60

# Code smells
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignore long lines in templates (they often contain embedded HTML/JavaScript)
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S103
sonar.issue.ignore.multicriteria.e1.resourceKey=**/templates/**/*.py

# Ignore complexity in module files (OSINT modules are often complex)
sonar.issue.ignore.multicriteria.e2.ruleKey=python:FunctionComplexity
sonar.issue.ignore.multicriteria.e2.resourceKey=modules/**/*.py

# Ignore some code smells in web UI (legacy code patterns)
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=spiderfoot/webui/**/*.py

# SCM provider
sonar.scm.provider=git
