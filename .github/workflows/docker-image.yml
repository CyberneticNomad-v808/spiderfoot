name: Docker Image CI
on:
  push:
    branches: ["dev*"]
  pull_request:
    branches: [master,"dev*"]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/111473637907/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-actions-spiderfoot@intranet-of-tools.iam.gserviceaccount.com'

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Lint Dockerfile with Hadolint
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        failure-threshold: error

    - name: Generate timestamp tag
      id: timestamp
      run: |
        TIMESTAMP=$(date -u '+%d%b%Y-%H%M%S')
        MILLISECONDS=$(date -u '+%3N')
        TAG="v5.4.0.${TIMESTAMP}.${MILLISECONDS}"
        TAG=$(echo "$TAG" | tr '[:lower:]' '[:upper:]')
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Generated tag: $TAG"

    - name: Build and push Docker image
      id: docker_build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          us-central1-docker.pkg.dev/intranet-of-tools/blkc-foot-enterprise/blkc-spiderfoot:${{ github.sha }}
          us-central1-docker.pkg.dev/intranet-of-tools/blkc-foot-enterprise/blkc-spiderfoot:latest
          us-central1-docker.pkg.dev/intranet-of-tools/blkc-foot-enterprise/blkc-spiderfoot:v5.3.4-${{ steps.timestamp.outputs.tag }}
    - name: Trivy vulnerability scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'us-central1-docker.pkg.dev/intranet-of-tools/blkc-foot-enterprise/blkc-spiderfoot:${{ github.sha }}'
        ignore-unfixed: 'true'

    - name: Run container tests
      run: |
        set -e
        IMAGE=us-central1-docker.pkg.dev/intranet-of-tools/blkc-foot-enterprise/blkc-spiderfoot:${{ github.sha }}
        CONTAINER=spiderfoot-test

        # CLI tests
        docker run --rm $IMAGE sf.py -h || { echo 'sf.py -h failed'; exit 1; }
        docker run --rm $IMAGE sf.py --version || { echo 'sf.py --version failed'; exit 1; }
